{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="background-color: var(--uk-blue); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                        <h3 class="mb-0">
                            <img src="{{ url_for('static', filename='images/UKsmall.jpg') }}" alt="UK" width="24" height="24" class="me-2 align-text-bottom">
                            UK TCE Admin
                        </h3>
                    </div>
                    <p class="text-muted mb-0">Super Admin Fallback Login</p>
                </div>

                <form method="POST" action="{{ url_for('auth.admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="Admin username" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Admin Login
                    </button>
                </form>
            </div>
        </div>
        
        <p class="text-center text-muted mt-3 small">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to main login</a>
        </p>
    </div>
</div>
{% endblock %}
