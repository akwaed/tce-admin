{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <!-- UK Logo Area -->
                <div class="text-center mb-4">
                    <div style="background-color: var(--uk-blue); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                        <h3 class="mb-0">
                            <i class="bi bi-building me-2"></i>UK TCE Admin
                        </h3>
                    </div>
                    <p class="text-muted">Teacher Course Evaluation Administration</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="Enter your LinkBlue or admin username" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-uk-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
                
                <!-- Azure AD Login (disabled for now) -->
                <div class="text-center mt-4">
                    <hr>
                    <p class="text-muted small mb-2">University Single Sign-On</p>
                    <button class="btn btn-outline-secondary w-100" disabled title="Coming soon - Azure AD integration pending">
                        <i class="bi bi-microsoft me-2"></i>Sign in with UK Account
                        <br><small class="text-muted">(Coming Soon)</small>
                    </button>
                </div>
            </div>
        </div>
        
        <p class="text-center text-muted mt-3 small">
            University of Kentucky<br>
            Contact your TCE administrator for access
        </p>
    </div>
</div>
{% endblock %}
