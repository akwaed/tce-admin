{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <!-- UK Logo Area -->
                <div class="text-center mb-4">
                    <div style="background-color: var(--uk-blue); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                        <h3 class="mb-0">
                            <img src="{{ url_for('static', filename='images/UKsmall.jpg') }}" alt="UK" width="24" height="24" class="me-2 align-text-bottom">
                            UK TCE Admin
                        </h3>
                    </div>
                    <p class="text-muted">Teacher Course Evaluation Administration</p>
                </div>
                
                <!-- Azure AD Login - MOVED TO TOP -->
                <div class="text-center mb-4">
                    <a href="{{ url_for('auth.azure_login') }}" class="btn btn-uk-primary w-100 py-3">
                        <i class="bi bi-microsoft me-2"></i>Sign in with LinkBlue
                    </a>
                    <p class="text-muted small mt-2 mb-0">University Single Sign-On</p>
                </div>
                <div class="text-center">
                    <a href="{{ url_for('auth.admin_login') }}" class="btn btn-link btn-sm text-decoration-none">
                        Admin fallback login
                    </a>
                </div>
            </div>
        </div>
        
        <p class="text-center text-muted mt-3 small">
            University of Kentucky<br>
            Contact your TCE administrator for access
        </p>
    </div>
</div>
{% endblock %}
